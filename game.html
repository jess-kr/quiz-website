<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>The Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <button id="hamburger-toggle" aria-label="Open menu">&#9776;</button>
        <nav id="hamburger-nav">
            <a href="index.html">Restart</a>
            <a href="player.html">Change Player </a>
            <a id="dark-mode-toggle"></a>
            <a href="https://jess-kr.github.io/website/#contact">Report Issues</a>
        </nav>
    </header>
    <main id="quizBox">
    <div class="headRow">

        <div class="headRow-item">
            <p>Lives</p>
            <p id="lives">3</p>
        </div>

        <div class="headRow-item">
            <p>Score</p>
            <p id="score">0</p>
        </div>

        <div class="headRow-item">
            <div class="playerDisplay">
                <p> Player: </p>
                <img id="player-img" src="" alt="your current player">
                <p id="player">None</p>
            </div>
        </div>

    </div>


    <div class="progressBarWrapper">
        <div id="progressBar">
            <div id="progressFill"></div>
        </div>
        <div class="headRow-item">
            <p>Category: </p>
            <p id="category">None</p>
        </div>
    </div>


    <div id="quiz">
        </section>
        </main>

        <script src="game.js"></script>
        <script src="darkmode_hamburger.js"></script>

</body>

</html>
